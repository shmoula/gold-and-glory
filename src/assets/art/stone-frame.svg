<svg width="288" height="288" viewBox="0 0 288 288" xmlns="http://www.w3.org/2000/svg">
  <!-- Stone-brick nine-slice frame (spec 6.17 Phase 3). 96px slice geometry: four 96x96 corner
       blocks, 96-wide edge strips between them, EMPTY center (discarded by border-image).
       A child's drawing of colored masonry: irregular rounded blocks with mortar gaps showing
       the ink between. Palette is tokens-only: every block is a stone-2 #93836d underblock with
       an optional colour tint layered over at fill-opacity .35 (ink-soft #6b5638, moss-ink
       #3f6b35, commit #3e6fae, gold-mid #b98a3a, blood-ink #9c3226). Pen is the pack ink #2f2318;
       stroke-width 15 here scales the pack pen (stroke 2 at a 40 viewBox) to this 288 viewBox so
       the RENDERED mortar (96px slices into the ~12px band) matches the chicken's line. Each
       edge-strip block sits inside a 4-unit end margin so border-image-repeat round tiles the
       strip seamlessly and never slices a block in half. -->
  <!-- underblocks: #93836d stone base + ink outline (the mortar) -->
  <g fill="#93836d" stroke="#2f2318" stroke-width="15" stroke-linejoin="round">
    <!-- top-left corner -->
    <rect x="0" y="0" width="44" height="44" rx="7"/>
    <rect x="50" y="2" width="40" height="42" rx="8"/>
    <rect x="2" y="50" width="42" height="40" rx="6"/>
    <rect x="50" y="50" width="40" height="40" rx="9"/>
    <!-- top edge strip (tiles horizontally) -->
    <rect x="100" y="0" width="40" height="44" rx="7"/>
    <rect x="146" y="0" width="40" height="44" rx="8"/>
    <rect x="100" y="50" width="40" height="42" rx="9"/>
    <rect x="146" y="50" width="40" height="42" rx="6"/>
    <!-- top-right corner -->
    <rect x="244" y="0" width="44" height="44" rx="8"/>
    <rect x="198" y="2" width="40" height="42" rx="6"/>
    <rect x="198" y="50" width="40" height="40" rx="9"/>
    <rect x="244" y="50" width="44" height="40" rx="7"/>
    <!-- left edge strip (tiles vertically) -->
    <rect x="0" y="100" width="44" height="40" rx="7"/>
    <rect x="50" y="100" width="42" height="40" rx="9"/>
    <rect x="0" y="146" width="44" height="42" rx="6"/>
    <rect x="50" y="146" width="42" height="42" rx="8"/>
    <!-- right edge strip (tiles vertically) -->
    <rect x="244" y="100" width="44" height="40" rx="6"/>
    <rect x="198" y="100" width="42" height="40" rx="8"/>
    <rect x="244" y="146" width="44" height="42" rx="9"/>
    <rect x="198" y="146" width="42" height="42" rx="7"/>
    <!-- bottom-left corner -->
    <rect x="0" y="244" width="44" height="44" rx="8"/>
    <rect x="50" y="244" width="40" height="44" rx="6"/>
    <rect x="2" y="198" width="42" height="40" rx="9"/>
    <rect x="50" y="198" width="40" height="40" rx="7"/>
    <!-- bottom edge strip (tiles horizontally) -->
    <rect x="100" y="244" width="40" height="44" rx="8"/>
    <rect x="146" y="244" width="40" height="44" rx="7"/>
    <rect x="100" y="198" width="40" height="42" rx="6"/>
    <rect x="146" y="198" width="40" height="42" rx="9"/>
    <!-- bottom-right corner -->
    <rect x="244" y="244" width="44" height="44" rx="7"/>
    <rect x="198" y="244" width="40" height="44" rx="9"/>
    <rect x="198" y="198" width="40" height="40" rx="6"/>
    <rect x="244" y="198" width="44" height="40" rx="8"/>
  </g>
  <!-- coloured tints over selected blocks (fill-opacity .35, no outline of their own) -->
  <g fill-opacity=".35" stroke="none">
    <!-- top-left -->
    <rect x="50" y="2" width="40" height="42" rx="8" fill="#b98a3a"/>
    <rect x="2" y="50" width="42" height="40" rx="6" fill="#3f6b35"/>
    <rect x="50" y="50" width="40" height="40" rx="9" fill="#3e6fae"/>
    <!-- top edge -->
    <rect x="100" y="0" width="40" height="44" rx="7" fill="#6b5638"/>
    <rect x="146" y="0" width="40" height="44" rx="8" fill="#3f6b35"/>
    <rect x="100" y="50" width="40" height="42" rx="9" fill="#9c3226"/>
    <rect x="146" y="50" width="40" height="42" rx="6" fill="#b98a3a"/>
    <!-- top-right -->
    <rect x="198" y="2" width="40" height="42" rx="6" fill="#9c3226"/>
    <rect x="198" y="50" width="40" height="40" rx="9" fill="#3f6b35"/>
    <rect x="244" y="50" width="44" height="40" rx="7" fill="#3e6fae"/>
    <!-- left edge -->
    <rect x="50" y="100" width="42" height="40" rx="9" fill="#3e6fae"/>
    <rect x="0" y="146" width="44" height="42" rx="6" fill="#b98a3a"/>
    <rect x="50" y="146" width="42" height="42" rx="8" fill="#3f6b35"/>
    <!-- right edge -->
    <rect x="198" y="100" width="42" height="40" rx="8" fill="#9c3226"/>
    <rect x="244" y="146" width="44" height="42" rx="9" fill="#6b5638"/>
    <rect x="198" y="146" width="42" height="42" rx="7" fill="#b98a3a"/>
    <!-- bottom-left -->
    <rect x="50" y="244" width="40" height="44" rx="6" fill="#b98a3a"/>
    <rect x="2" y="198" width="42" height="40" rx="9" fill="#3e6fae"/>
    <rect x="50" y="198" width="40" height="40" rx="7" fill="#9c3226"/>
    <!-- bottom edge -->
    <rect x="100" y="244" width="40" height="44" rx="8" fill="#b98a3a"/>
    <rect x="146" y="244" width="40" height="44" rx="7" fill="#3e6fae"/>
    <rect x="100" y="198" width="40" height="42" rx="6" fill="#3f6b35"/>
    <rect x="146" y="198" width="40" height="42" rx="9" fill="#9c3226"/>
    <!-- bottom-right -->
    <rect x="198" y="244" width="40" height="44" rx="9" fill="#3f6b35"/>
    <rect x="198" y="198" width="40" height="40" rx="6" fill="#b98a3a"/>
    <rect x="244" y="198" width="44" height="40" rx="8" fill="#6b5638"/>
  </g>
  <!-- one low-opacity crayon-hatch group across a few blocks -->
  <g stroke="#2f2318" stroke-opacity=".1" stroke-width="8" stroke-linecap="round" fill="none">
    <path d="M8 12 38 40"/>
    <path d="M108 8 134 38"/>
    <path d="M256 10 282 38"/>
    <path d="M8 108 40 136"/>
    <path d="M256 156 284 182"/>
    <path d="M108 256 138 282"/>
    <path d="M256 256 282 282"/>
  </g>
</svg>
