<svg viewBox="0 0 40 48" xmlns="http://www.w3.org/2000/svg" fill="#d9a441" stroke="#2f2318" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
  <!-- Rubber chicken, in-house §2.3 house-recipe asset. Facing right (travel direction;
       CSS scaleX flips the return leg). Feet planted on the baseline. Ink outline #2f2318 at
       stroke-width 2 — the pack-wide pen, locked here (design 2026-08-02 §2.3). -->
  <!-- feet (splayed, blood) drawn first so the body covers the leg tops -->
  <path d="M11 30 10 43" fill="none"/>
  <path d="M16 30 17 43" fill="none"/>
  <path d="M10 43 6 47 8.5 47 10 45 11.5 47 14 47Z" fill="#b5402f"/>
  <path d="M17 43 13 47 15.5 47 17 45 18.5 47 21 47Z" fill="#b5402f"/>
  <!-- plump body oval -->
  <ellipse cx="14" cy="22" rx="9" ry="10"/>
  <!-- one shade layer: belly crescent on the underside, no outline of its own -->
  <path d="M6 23C8 32 20 32 22 23 20 28 8 28 6 23Z" fill="#b07f24" stroke="none"/>
  <!-- two stubby wing bumps on the near flank -->
  <circle cx="19" cy="22" r="3"/>
  <circle cx="18" cy="27" r="2.6"/>
  <!-- drooping neck curving forward and down -->
  <path d="M18 15C20 9 28 8 31 13 33 16 33 19 31 21 28 20 24 19 19 21Z"/>
  <!-- small dismayed head -->
  <circle cx="31" cy="18" r="4.8"/>
  <!-- open beak (blood) -->
  <path d="M35 16 39 17.5 35 19Z" fill="#b5402f"/>
  <path d="M35 20 38 21 35 21.5Z" fill="#b5402f"/>
  <!-- round eye -->
  <circle cx="31" cy="17" r="1.4" fill="#2f2318" stroke="none"/>
  <!-- one low-opacity crayon-hatch group -->
  <g stroke="#2f2318" stroke-opacity=".12" stroke-width="1.5" fill="none">
    <path d="M9 15Q12 13 15 15"/>
    <path d="M8 19Q12 17 16 19"/>
    <path d="M9 24Q12 23 15 25"/>
  </g>
</svg>
