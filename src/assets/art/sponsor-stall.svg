<svg viewBox="0 0 120 100" xmlns="http://www.w3.org/2000/svg" fill="#5f4227" stroke="#2f2318" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
  <!-- Sponsor wooden market stall & Lord Biggus (hub.png reference) -->
  <!-- wooden stall roof banner -->
  <path d="M10 25 L110 25 L105 5 L15 5 Z" fill="#b5402f"/>
  <path d="M20 25 L35 25 L35 5 L20 5 Z M50 25 L65 25 L65 5 L50 5 Z M80 25 L95 25 L95 5 L80 5 Z" fill="#f6ecd1" stroke="none"/>
  <!-- wooden poles -->
  <rect x="15" y="25" width="8" height="50" fill="#46301b"/>
  <rect x="97" y="25" width="8" height="50" fill="#46301b"/>
  <!-- Lord Biggus character inside stall -->
  <ellipse cx="60" cy="48" rx="14" ry="15" fill="#d9c69a"/> <!-- head -->
  <path d="M48 60 72 60 76 75 44 75Z" fill="#3f6b35"/> <!-- toga -->
  <!-- smirking / shouting mouth -->
  <path d="M54 52Q60 58 66 52Z" fill="#b5402f"/>
  <!-- eyes & eyebrows -->
  <circle cx="53" cy="44" r="2" fill="#2f2318" stroke="none"/>
  <circle cx="67" cy="44" r="2" fill="#2f2318" stroke="none"/>
  <path d="M50 40 57 42 M70 42 77 40" fill="none"/>
  <!-- gesturing arm with goblet -->
  <path d="M72 56 86 50 86 40" fill="none"/>
  <rect x="82" y="34" width="8" height="10" rx="2" fill="#d9a441"/>
  <!-- front wooden counter -->
  <rect x="10" y="70" width="100" height="25" rx="4" fill="#6b4a2a"/>
  <path d="M10 82 110 82" stroke="#2f2318" stroke-width="3"/>
</svg>
