<svg viewBox="0 0 300 150" xmlns="http://www.w3.org/2000/svg">
  <!-- Confetti scatter, in-house derivative inspired by "organized confetti" (10binary,
       openclipart 148675). That base tiles ~700 abutting squares edge-to-edge across its
       whole canvas — not a scatter — so this is a fresh scatter of rotated pieces cycling
       the palette below, on transparency. Credited in CREDITS.md. -->
  <rect x="20" y="30" width="14" height="8" rx="1" fill="#3e6fae" transform="rotate(15 27 34)" />
  <rect x="55" y="15" width="10" height="10" rx="1" fill="#d9a441" transform="rotate(-20 60 20)" />
  <rect x="90" y="45" width="16" height="7" rx="1" fill="#b5402f" transform="rotate(40 98 48.5)" />
  <rect x="120" y="20" width="9" height="9" rx="1" fill="#3f6b35" transform="rotate(10 124.5 24.5)" />
  <rect x="150" y="60" width="14" height="8" rx="1" fill="#f6ecd1" transform="rotate(-35 157 64)" />
  <rect x="180" y="25" width="11" height="11" rx="1" fill="#3e6fae" transform="rotate(60 185.5 30.5)" />
  <rect x="210" y="50" width="15" height="7" rx="1" fill="#d9a441" transform="rotate(-10 217.5 53.5)" />
  <rect x="240" y="20" width="10" height="10" rx="1" fill="#b5402f" transform="rotate(25 245 25)" />
  <rect x="270" y="55" width="13" height="8" rx="1" fill="#3f6b35" transform="rotate(-50 276.5 59)" />
  <rect x="35" y="90" width="12" height="12" rx="1" fill="#f6ecd1" transform="rotate(30 41 96)" />
  <rect x="100" y="110" width="16" height="7" rx="1" fill="#3e6fae" transform="rotate(-25 108 113.5)" />
  <rect x="160" y="95" width="10" height="10" rx="1" fill="#d9a441" transform="rotate(45 165 100)" />
  <rect x="220" y="115" width="14" height="8" rx="1" fill="#b5402f" transform="rotate(15 227 119)" />
  <rect x="260" y="100" width="11" height="11" rx="1" fill="#3f6b35" transform="rotate(-40 265.5 105.5)" />
</svg>
