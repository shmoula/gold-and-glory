<svg viewBox="0 0 120 90" xmlns="http://www.w3.org/2000/svg" fill="#d9c69a" stroke="#2f2318" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">
  <!-- Brute, tier 1 (§5.4): bulky, low menace — horned helm, wide jaw, tiny eyes,
       chipped horns, one missing tooth. House recipe, pack pen (stroke 6). -->
  <!-- massive shoulders -->
  <path d="M8 90 14 72Q60 58 106 72L112 90Z" fill="#6b5638"/>
  <!-- thick neck -->
  <path d="M46 58 46 74 74 74 74 58Z"/>
  <!-- wide heavy jaw -->
  <path d="M36 36Q34 70 60 70 86 70 84 36Z"/>
  <!-- horned helm cap -->
  <path d="M33 40Q30 20 60 18 90 20 87 40Q60 32 33 40Z" fill="#93836d"/>
  <!-- two chipped horns -->
  <path d="M33 34Q18 30 16 14 27 20 36 26Z" fill="#93836d"/>
  <path d="M87 34Q102 30 104 14 93 20 84 26Z" fill="#93836d"/>
  <!-- tiny mean eyes -->
  <circle cx="50" cy="45" r="2" fill="#2f2318" stroke="none"/>
  <circle cx="70" cy="45" r="2" fill="#2f2318" stroke="none"/>
  <!-- flat heavy brow -->
  <path d="M44 39 56 39" fill="none"/>
  <path d="M64 39 76 39" fill="none"/>
  <!-- grim mouth with a missing tooth (gap) -->
  <path d="M46 58Q60 62 74 58" fill="none"/>
  <path d="M57 58 57 63" fill="none"/>
  <path d="M64 58 64 63" fill="none"/>
  <!-- one shade layer under the jaw -->
  <path d="M40 50Q60 72 80 50 80 62 60 70 40 62 40 50Z" fill="#b98a3a" fill-opacity=".25" stroke="none"/>
  <!-- one crayon-hatch group -->
  <g stroke="#2f2318" stroke-opacity=".12" stroke-width="3" fill="none">
    <path d="M40 27Q60 22 80 27"/>
    <path d="M42 33Q60 29 78 33"/>
  </g>
</svg>
