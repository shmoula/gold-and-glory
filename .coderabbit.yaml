# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# CodeRabbit review configuration. Read from the *feature branch* under review,
# so a change here applies to the PR that introduces it — no need to land on
# main first.

language: en-US

reviews:
  # Skip Markdown. All the prose in this repo is README.md plus docs/ — the
  # superpowers plans/specs, which are dated working records rather than
  # shipped artifacts. Reviewing them yields stale-plan nitpicks and MD040
  # fence warnings instead of findings about the game.
  #
  # Exclusions only: any path not matched by a `!` pattern stays under review, so
  # src/, tests/, and config files are unaffected.
  path_filters:
    - '!**/*.md'

  pre_merge_checks:
    # Off, not merely lowered past the threshold. This codebase documents with
    # block comments above the declaration — spec-section citations, the reason
    # behind a choice, the alternative that was rejected — rather than JSDoc, so
    # the coverage figure measures a convention the repo deliberately does not
    # follow. A percentage that can only ever be wrong is noise on every PR.
    docstrings:
      # Quoted deliberately: the schema wants the string "off", and a YAML 1.1
      # parser reads bare `off` as the boolean false.
      mode: 'off'

  tools:
    # markdownlint-cli2 has nothing left to lint once Markdown is filtered out.
    markdownlint:
      enabled: false
    # Grammar/style checker — in this repo it only has Markdown prose to chew on.
    languagetool:
      enabled: false
